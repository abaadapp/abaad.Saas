name: CI

# البوابة كانت تعيش في خطّاف Claude على جهاز واحد: أي تعديل من جهاز آخر
# أو من واجهة GitHub كان يمرّ بلا فحص. هنا تُفرض على كل PR.
#
# ═══ وعلى الطلب وحده — لا على main بعد دمجه ═══
#
# كانت تعمل ثانيةً على main بعد الدمج، فتختبر الشجرةَ نفسها مرّتين وتؤخّر النشر
# ساعة. صار الطلبُ يرفع في آخره إثباتَ الشجرة التي اجتازت (`pr-proof`)، و«Main
# Gate» على main يتحقّق أنّ شجرة main هي إيّاها قبل أن يُنشر شيء. وما لا يُثبَت
# لا يُنشر تلقائيًّا — دفعةٌ مباشرة منه. انظر `main-gate.yml`.
#
# و`workflow_dispatch` بابٌ يدويّ لتشغيلها على أيّ فرعٍ عند الحاجة — ولا يرفع
# إثباتًا: الإثباتُ للطلبات وحدها.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  # دفعة جديدة تُلغي فحص الدفعة السابقة لنفس الفرع — لا داعي لانتظار القديم
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # الاختبارات على SQLite — سريعة، وهي محرّك التطوير الحالي
  # ---------------------------------------------------------------------
  tests-sqlite:
    name: الاختبارات (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 8.4 لا 8.3: مكوّنات Symfony 8.1 في composer.lock تتطلّب php >= 8.4.1،
      # فكان `composer install` ينهار قبل أن يبدأ أي اختبار — ففشلت كل دفعة
      # منذ إنشاء الوظيفة، ولم يُشغَّل اختبارٌ واحد ولا فحصُ أنواعٍ واحد.
      # بوابةٌ حمراء دائمًا لا تختلف عن بوابةٍ غير موجودة، بل أسوأ: تُشعر
      # بالأمان. وحين تُرفع الأقفال إلى إصدارٍ أعلى يُرفع هذا معها.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, intl, bcmath, gd, zip
          coverage: none

      - name: تثبيت اعتماديات PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: تجهيز البيئة
        run: |
          cp .env.example .env
          php artisan key:generate

      # اختباراتٌ تفتح صفحات Inertia تُصيّر app.blade.php، و@vite يرمي
      # ViteManifestNotFoundException بلا public/build/manifest.json —
      # وهو مجلّد متجاهَل في git فلا يصل الخادم أبدًا. البناء هنا شرطُ
      # تشغيلها، لا تحسينٌ اختياري.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: بناء الواجهة (لازم لبيان Vite)
        run: |
          npm ci
          npx vite build

      - name: الاختبارات
        run: php artisan test

  # ---------------------------------------------------------------------
  # الاختبارات على PostgreSQL — محرّك الإنتاج المقصود.
  #
  # SQLite يقفل القاعدة كاملة عند كل كتابة، وهذا لا يصلح لصناديق بيع
  # متزامنة. والانتقال يكسر SQL خاصًّا بـSQLite (strftime، النصوص بعلامات
  # مزدوجة) بصمت — فيُكتشف عند التاجر لا عندنا. هذه الوظيفة تمنع ذلك.
  #
  # ═══ وثلاثةُ أقسامٍ متوازية لا عمليّةٌ واحدة ═══
  #
  # الحزمةُ كلُّها في عمليّةٍ واحدة على PostgreSQL كانت تأخذ ٣٠–٤٥ دقيقة، ثمّ
  # صارت تعلق في أواخرها: اختبارُ تصدير التقارير — ٤ ثوانٍ في أوّلها ومحلّيًّا —
  # بلغ ٧١٨ ثانية ثمّ ١٦٣٩ ثمّ تجاوز الساعة (PR #82). ما يتراكم عبر ستّة آلاف
  # اختبارٍ في عمليّةٍ واحدة وقاعدةٍ واحدة يُبطئ آخرَها، ولا يظهر في اختبارٍ وحده.
  #
  # فتُقسَم ملفّاتُ الاختبار ثلاثةً بترتيبها (`NR % 3`)، كلُّ قسمٍ في وظيفةٍ
  # وقاعدةٍ وعمليّةٍ له. والأقسامُ معًا هي الحزمةُ كلُّها بلا نقص — والخطوةُ
  # تتحقّق من ذلك بعدِّ ما تقول PHPUnit إنّه فيها قبل أن تبدأ.
  # ---------------------------------------------------------------------
  tests-postgres:
    name: الاختبارات (PostgreSQL ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest

    strategy:
      # قسمٌ يسقط لا يُلغي أخويه — يُرى ما سقط كلُّه في دفعةٍ واحدة
      fail-fast: false
      matrix:
        shard: [0, 1, 2]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: testing
          POSTGRES_USER: abaad
          POSTGRES_PASSWORD: secret
        ports: ['5432:5432']
        # لا نبدأ الاختبارات قبل أن تجهز القاعدة فعلًا
        options: >-
          --health-cmd="pg_isready -U abaad"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: testing
      DB_USERNAME: abaad
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4' # كما في وظيفة SQLite أعلاه
          extensions: pdo_pgsql, mbstring, intl, bcmath, gd, zip
          coverage: none

      - name: تثبيت اعتماديات PHP
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: تجهيز البيئة
        run: |
          cp .env.example .env
          php artisan key:generate

      # phpunit.xml يثبّت DB_CONNECTION=sqlite، وقيمُ <env> فيه تسبق متغيّرات
      # الوظيفة — فكانت هذه الوظيفة تُشغّل على SQLite وتُسمّى «PostgreSQL».
      # تظهر خضراء يومًا فيُظنّ المحرّك مبرهَنًا وهو لم يُلمس. تُنزع القيمتان
      # هنا فقط، ويبقى الملف كما هو للتشغيل المحلي.
      - name: توجيه الاختبارات إلى PostgreSQL فعلًا
        run: |
          php -r '$f="phpunit.xml"; $s=file_get_contents($f);
                  $s=preg_replace("/^\s*<env name=\"DB_(CONNECTION|DATABASE|URL)\".*\R/m", "", $s);
                  file_put_contents($f, $s);'
          grep -q 'DB_CONNECTION' phpunit.xml && { echo "لم تُنزع القيمة"; exit 1; } || true

      # ‏JIT يُطفأ في قاعدة الاختبار — كان يُضاعف زمن القسم أضعافًا.
      #
      # صورةُ postgres:16 مبنيّةٌ بـLLVM فـJIT فيها يعمل، ويُترجم كلَّ استعلامٍ
      # تتجاوز كلفتُه المقدَّرة `jit_above_cost`. واختبارُ عزل المتاجر يفتح كلَّ
      # شاشةٍ على متجرين كاملين وجداولُه منتفخةٌ بصفوفِ ما تراجعت عنه
      # الاختباراتُ قبله، فتُقدَّر استعلاماتُه غاليةً وتُترجم واحدًا واحدًا:
      # بلغ اختباران فيه ٧٢ دقيقة من ٨٠ في القسم 2/3، وهما عشرُ ثوانٍ على
      # PostgreSQL بلا JIT. والإطفاءُ للاختبار وحده: لا يمسّ الإنتاج ولا الهجرات.
      - name: إطفاء JIT في قاعدة الاختبار
        env:
          PGPASSWORD: secret
        run: |
          psql -h 127.0.0.1 -U abaad -d testing -v ON_ERROR_STOP=1 -c "ALTER DATABASE testing SET jit = off"
          # جلسةٌ جديدة تقرأ الإعداد كما ستقرؤه الاختبارات
          [ "$(psql -h 127.0.0.1 -U abaad -d testing -Atc 'show jit')" = "off" ] \
            || { echo "::error::لم يُطفأ JIT"; exit 1; }

      # ‏والتنظيفُ التلقائيّ (autovacuum) يُطفأ في خادم الاختبار — هو ما بقي.
      #
      # كلُّ اختبارٍ يكتب بياناته داخل معاملةٍ لا تُثبَّت ثمّ تُتراجع. فإن جرى
      # `ANALYZE` التلقائيّ أثناء القسم رأى الجداولَ فارغةً وكتب ذلك في
      # إحصاءاتها، فيخطّط المحرّكُ لجداولَ فارغةٍ وهي تحمل آلافَ الصفوف داخل
      # المعاملة: حلقاتٌ متداخلة تمسح الجدولَ لكلّ صفّ. وبسجلّ الاستعلامات
      # البطيئة على هذا الفحص نفسه: استعلامُ دفترٍ واحد بلغ ٣٢٠ ثانية، و٦٣
      # استعلامًا كهذا أخذت ٨٣ دقيقة من ٩٢ في القسم 0/3. وبلا تحليلٍ تلقائيّ
      # تبقى الإحصاءاتُ «غيرَ معروفة» فيُقدَّر الحجمُ من صفحات الجدول نفسه.
      # والإطفاءُ للخادم المؤقّت في الفحص وحده — لا يمسّ الإنتاج.
      - name: إطفاء التحليل التلقائيّ في خادم الاختبار
        env:
          PGPASSWORD: secret
        run: |
          psql -h 127.0.0.1 -U abaad -d testing -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET autovacuum = off" -c "SELECT pg_reload_conf()"
          [ "$(psql -h 127.0.0.1 -U abaad -d testing -Atc 'show autovacuum')" = "off" ] \
            || { echo "::error::لم يُطفأ autovacuum"; exit 1; }

      - name: الهجرات تعمل على PostgreSQL
        run: php artisan migrate --force

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: بناء الواجهة (لازم لبيان Vite)
        run: |
          npm ci
          npx vite build

      # ملفّاتُ هذا القسم — وأقسامٌ ثلاثةٌ تجمع الحزمةَ كلَّها، لا ملفًّا أقلّ
      - name: ملفّات هذا القسم
        run: |
          find tests -name '*Test.php' | sort > all-tests.txt
          awk -v s=${{ matrix.shard }} 'NR % 3 == s' all-tests.txt > shard-tests.txt
          full=$(vendor/bin/phpunit --list-tests | grep -c '^ - ')
          sum=0
          for s in 0 1 2; do
            n=$(vendor/bin/phpunit --list-tests $(awk -v s=$s 'NR % 3 == s' all-tests.txt) | grep -c '^ - ')
            sum=$((sum + n))
          done
          echo "الحزمة: $full اختبارًا — الأقسام معًا: $sum"
          [ "$full" -eq "$sum" ] || { echo "الأقسامُ لا تغطّي الحزمة كلَّها"; exit 1; }

      - name: الاختبارات
        run: php artisan test $(cat shard-tests.txt)

  # ---------------------------------------------------------------------
  # الواجهة: أنواع TypeScript، وسلوكُ المكوّنات، والبناء
  #
  # واختباراتُ الواجهة هنا لا في وظيفتَي PHP: لا تمسّ قاعدةً ولا تحتاج
  # composer، فتشغيلُها مرّتين على محرّكين إهدارُ دقائق على كلّ دفعة.
  # ---------------------------------------------------------------------
  frontend:
    name: الواجهة (أنواع + اختبارات + بناء)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: فحص الأنواع
        run: npx tsc --noEmit

      # ما لا يُشغّله إلّا متصفّح: السهم ينقل المؤشّر، والنافذة تبقى مفتوحة،
      # وزرُّ حذفٍ لا يُرسم على سندٍ يردّه الخادم. انظر DEC-002.
      - name: اختبارات الواجهة
        run: npm test

      - name: البناء
        run: npx vite build

  # ---------------------------------------------------------------------
  # إثباتُ الشجرة التي اجتازت — يقرؤه «Main Gate» بعد الدمج بدل إعادة الاختبارات
  #
  # لا يعمل إلّا بعد نجاح الوظائف الثلاث، وعلى الطلبات وحدها. ويُسحب `github.sha`
  # لا الاسمُ `refs/pull/N/merge`: هو إيداعُ ذلك الاسم الذي سحبته الوظائفُ الثلاث
  # بعينه، والاسمُ نفسُه يُعاد حسابُه كلّما تحرّك main — فسحبُه هنا بعد ساعةٍ قد
  # يُعطي شجرةً لم تُختبر. والخطوةُ تتحقّق أنّ الاسم هو اسمُ هذا الطلب.
  #
  # ولا يُرفع إثباتٌ إن تحرّك main أثناء الاختبار: أساسُ ما اختُبر (`HEAD^1`)
  # يجب أن يكون رأسَ main الآن — وإلّا تسقط الوظيفةُ وتطلب تحديثَ الطلب.
  # إلّا أن يكون كلُّ ما وصل main بعده وثائقَ تخطيط (`docs-only-change.sh`):
  # فالكودُ هو ما اختُبر، ولا تُعاد ساعةُ PostgreSQL لسطرٍ في BACKLOG.md.
  # ---------------------------------------------------------------------
  pr-proof:
    name: إثبات الشجرة المختبَرة
    if: github.event_name == 'pull_request'
    needs: [tests-sqlite, tests-postgres, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: كتابة الإثبات
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TESTED_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail

          # الإيداعُ المختبَر إيداعُ دمج هذا الطلب — لا شيءٌ آخر سُحب صدفة
          [ "$GITHUB_REF" = "refs/pull/${PR_NUMBER}/merge" ] \
            || { echo "::error::المرجع ${GITHUB_REF} ليس refs/pull/${PR_NUMBER}/merge"; exit 1; }
          [ "$(git rev-parse HEAD)" = "$TESTED_SHA" ] \
            || { echo "::error::المسحوب ليس ${TESTED_SHA}"; exit 1; }

          # ولا إثباتَ لمزيجٍ تقادم: إن تحرّك main أثناء الاختبار (طلبٌ آخر دُمج
          # في الساعة نفسها) فما اختُبر هو main القديم مع الطلب — ودمجُه الآن
          # يُنتج شجرةً لم تُختبر. فيُقال هنا، قبل الدمج، لا بعده في Main Gate.
          # والمرجعُ صريح: يكتب origin/main ولو لم يُضبط للبعيد مسارُ تتبّع.
          git fetch --no-tags --quiet origin +refs/heads/main:refs/remotes/origin/main
          TESTED_BASE=$(git rev-parse 'HEAD^1')
          CURRENT_MAIN=$(git rev-parse origin/main)
          # فإن تحرّك يُسأل: ماذا وصل؟ الفرقُ بين الشجرتين لا رسالةُ آخر إيداع —
          # فيشمل كلَّ ما دُفع في الساعة، إيداعًا واحدًا أو عشرة.
          if [ "$TESTED_BASE" != "$CURRENT_MAIN" ]; then
            echo "main moved: tested base ${TESTED_BASE}, main now ${CURRENT_MAIN}"
            set +e
            bash .github/scripts/docs-only-change.sh "$TESTED_BASE" "$CURRENT_MAIN"
            docs_only=$?
            set -e

            if [ "$docs_only" -eq 0 ]; then
              echo "main changed during CI, but only approved planning/documentation files changed."
              echo "Existing test result remains valid."
              {
                echo "### ℹ️ main تحرّك أثناء الاختبار — وثائقُ تخطيطٍ فقط"
                echo
                echo "main changed during CI, but only approved planning/documentation files changed. Existing test result remains valid."
                echo
                echo "- tested base: \`${TESTED_BASE}\`"
                echo "- main now: \`${CURRENT_MAIN}\`"
              } >> "$GITHUB_STEP_SUMMARY"
            else
              msg="main moved while this PR was being tested and the change is not documentation-only (files marked ✗ above); update the PR with latest main and rerun CI before merging."
              echo "::error title=PR proof::${msg} (tested base ${TESTED_BASE}, main now ${CURRENT_MAIN})"
              {
                echo "### ⛔ لا إثبات — main تحرّك أثناء الاختبار"
                echo
                echo "**${msg}**"
                echo
                echo "- tested base: \`${TESTED_BASE}\`"
                echo "- main now: \`${CURRENT_MAIN}\`"
              } >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi

          jq -n \
            --argjson pr_number "$PR_NUMBER" \
            --arg head_sha "$HEAD_SHA" \
            --arg base_sha "$BASE_SHA" \
            --arg tested_base_sha "$TESTED_BASE" \
            --arg tested_commit_sha "$TESTED_SHA" \
            --arg tested_ref "$GITHUB_REF" \
            --arg tested_tree_sha "$(git rev-parse 'HEAD^{tree}')" \
            --argjson workflow_run_id "$RUN_ID" \
            --argjson workflow_run_attempt "$RUN_ATTEMPT" \
            '{pr_number: $pr_number, head_sha: $head_sha, base_sha: $base_sha,
              tested_base_sha: $tested_base_sha, tested_commit_sha: $tested_commit_sha,
              tested_ref: $tested_ref, tested_tree_sha: $tested_tree_sha,
              workflow_run_id: $workflow_run_id, workflow_run_attempt: $workflow_run_attempt}' \
            > pr-proof.json

          cat pr-proof.json
          echo "### إثبات الشجرة المختبَرة" >> "$GITHUB_STEP_SUMMARY"
          printf '```json\n%s\n```\n' "$(cat pr-proof.json)" >> "$GITHUB_STEP_SUMMARY"

      # والاسمُ فريدٌ لكلّ تشغيلٍ ومحاولة: Main Gate يطلب `pr-proof-<PR>-<run>-`
      - uses: actions/upload-artifact@v4
        with:
          name: pr-proof-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: pr-proof.json
          if-no-files-found: error
          retention-days: 30
