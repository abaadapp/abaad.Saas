name: Claude Code Task Agent

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "GitHub issue number to execute"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

concurrency:
  group: claude-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  execute:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'claude:ready'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve issue number
        id: issue
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "number=${{ inputs.issue_number }}" >> "$GITHUB_OUTPUT"
          else
            echo "number=${{ github.event.issue.number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Start task
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue edit "$ISSUE_NUMBER" --remove-label "claude:ready" || true

          BODY="$(gh issue view "$ISSUE_NUMBER" --json body --jq .body)"
          UPDATED_BODY="$(printf '%s' "$BODY" | python3 -c 'import sys,re; s=sys.stdin.read(); print(re.sub(r"(?m)(^### Status\s*\n)[^\n]+", r"\1In Progress", s, count=1), end="")')"
          gh issue edit "$ISSUE_NUMBER" --body "$UPDATED_BODY"

      - name: Execute task with Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            Work on GitHub issue #${{ steps.issue.outputs.number }} in this repository.
            Read the entire issue first. The issue is the canonical task specification.
            Follow its Type, Status, Owner, Priority, Branch, Area / Files, Depends On, Prompt and Notes fields exactly.

            Mandatory safety rules:
            - Never commit directly to main.
            - Never merge a pull request.
            - Work only within the issue scope; do not perform unrelated refactors.
            - Fetch the latest main before implementation.
            - Use the Branch specified in the issue. If it is a placeholder, replace it with a short descriptive claude/feature/... or claude/fix/... branch.
            - Preserve tenant isolation, authorization, validation, data integrity and backward compatibility.
            - Inspect existing implementation and tests before editing.
            - Add/update tests for changed behavior and important edge cases.
            - Run the relevant test suite before finishing.
            - Review the final diff for unintended changes and merge-conflict risk.
            - Push commits and create or update a PR targeting main.
            - In the PR body reference the issue with "Closes #${{ steps.issue.outputs.number }}".
            - Update the issue with the final Branch, GitHub PR URL, test result and concise implementation summary.
            - Finish at review-ready state only. Do not merge.

      - name: Mark task in review
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        shell: bash
        run: |
          set -euo pipefail
          BODY="$(gh issue view "$ISSUE_NUMBER" --json body --jq .body)"
          UPDATED_BODY="$(printf '%s' "$BODY" | python3 -c 'import sys,re; s=sys.stdin.read(); print(re.sub(r"(?m)(^### Status\s*\n)[^\n]+", r"\1In Review", s, count=1), end="")')"
          gh issue edit "$ISSUE_NUMBER" --body "$UPDATED_BODY"

      - name: Mark task blocked on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        shell: bash
        run: |
          BODY="$(gh issue view "$ISSUE_NUMBER" --json body --jq .body)"
          UPDATED_BODY="$(printf '%s' "$BODY" | python3 -c 'import sys,re; s=sys.stdin.read(); print(re.sub(r"(?m)(^### Status\s*\n)[^\n]+", r"\1Blocked", s, count=1), end="")')"
          gh issue edit "$ISSUE_NUMBER" --body "$UPDATED_BODY" || true
