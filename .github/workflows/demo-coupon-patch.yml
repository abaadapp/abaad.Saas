name: One-time demo coupon patch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/demo-coupon-patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, mbstring, intl, bcmath, gd, zip
          coverage: none

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Add demo coupons
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('app/Support/DemoStore.php')
          source = path.read_text()
          old = """        foreach ([
                      ['WELCOME10', 'نسبة', 10, 5, 200],
                      ['EID2026', 'نسبة', 15, 10, 500],
                      ['FREESHIP', 'مبلغ', 2, 15, 300],
                      ['VIP20', 'نسبة', 20, 30, 50],
                  ] as $i => [$code, $type, $value, $min, $max]) {"""
          new = """        foreach ([
                      ['WELCOME10', 'نسبة', 10, 5, 200],
                      ['EID2026', 'نسبة', 15, 10, 500],
                      ['FREESHIP', 'مبلغ', 2, 15, 300],
                      ['VIP20', 'نسبة', 20, 30, 50],
                      ['DEMO15', 'نسبة', 15, 10, 150],
                      ['SAVE5', 'مبلغ', 5, 25, 100],
                      ['BIGORDER25', 'نسبة', 25, 100, 60],
                  ] as $i => [$code, $type, $value, $min, $max]) {"""
          if old not in source:
              raise SystemExit('Expected DemoStore coupon block was not found; refusing to patch.')
          path.write_text(source.replace(old, new, 1))
          PY

      - name: Add focused demo coupon test
        shell: bash
        run: |
          cat > tests/Feature/DemoCouponSeedTest.php <<'PHP'
          <?php

          namespace Tests\Feature;

          use App\Models\Business;
          use App\Models\Coupon;
          use App\Support\DemoStore;
          use Illuminate\Foundation\Testing\RefreshDatabase;
          use Tests\TestCase;

          class DemoCouponSeedTest extends TestCase
          {
              use RefreshDatabase;

              public function test_demo_store_has_new_discount_codes_and_keeps_them_tenant_isolated(): void
              {
                  $merchant = Business::create([
                      'name' => 'متجر حقيقي',
                      'type' => 'عام',
                      'status' => 'نشط',
                  ]);
                  $demo = DemoStore::create('متجر العرض', 'صغير');

                  $expected = [
                      'DEMO15' => ['نسبة', 15.0, 10.0, 150],
                      'SAVE5' => ['مبلغ', 5.0, 25.0, 100],
                      'BIGORDER25' => ['نسبة', 25.0, 100.0, 60],
                  ];

                  foreach ($expected as $code => [$type, $value, $minimum, $maxUses]) {
                      $coupon = Coupon::where('business_id', $demo->id)
                          ->where('code', $code)
                          ->firstOrFail();

                      $this->assertSame($type, $coupon->type);
                      $this->assertEquals($value, (float) $coupon->value);
                      $this->assertEquals($minimum, (float) $coupon->min_order);
                      $this->assertSame($maxUses, (int) $coupon->max_uses);
                      $this->assertTrue($coupon->active);
                      $this->assertTrue($coupon->expires_at->isFuture());
                      $this->assertDatabaseMissing('coupons', [
                          'business_id' => $merchant->id,
                          'code' => $code,
                      ]);
                      $this->assertSame(1, Coupon::where('business_id', $demo->id)->where('code', $code)->count());
                  }

                  DemoStore::reseed($demo, 'صغير');

                  foreach (array_keys($expected) as $code) {
                      $this->assertSame(
                          1,
                          Coupon::where('business_id', $demo->id)->where('code', $code)->count(),
                          "الكوبون {$code} يجب أن يبقى مرة واحدة بعد إعادة بناء الديمو",
                      );
                  }
              }
          }
          PHP

      - name: Run focused test
        run: php artisan test tests/Feature/DemoCouponSeedTest.php

      - name: Commit verified change to main and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "abaadapp-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/demo-coupon-patch.yml
          git add app/Support/DemoStore.php tests/Feature/DemoCouponSeedTest.php
          git commit -m "feat(demo): add tested discount codes"
          git push origin HEAD:main
