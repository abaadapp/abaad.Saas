name: Mobile

# تطبيقا أبعاد لنقطة البيع — يُبنيان ويُختبران حين يتغيّر ما تحت mobile/.
#
# ═══ ولمَ ملفٌّ منفصل عن CI ═══
#
# الطباعةُ المباشرة (`mobile/PROTOCOL.md`) كودٌ أصليٌّ لا يبنيه جهازُ التطوير
# المعتاد: لا JDK ولا Android SDK ولا Xcode عليه. فهنا يُبنى ويُختبر فعلًا.
# ولا يدخل إثباتَ الشجرة ولا «Main Gate»: النشرُ للخادم وحده، والتطبيقان لا
# يُنشران من main. ولا يُشغَّل لتغييرٍ لا يمسّهما.
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (اختبارات + بناء)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # لا `gradlew` في المستودع — الإصدارُ يُثبَّت هنا
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # العنوانُ من متغيّر المستودع `ABAAD_POS_BASE_URL` إن ضُبط (ليس سرًّا: هو ما
      # يفتحه المتصفّح)، وإلّا مثالٌ لا نطاق — البناءُ يحتاج قيمةً، والاختبارُ لا يتّصل به.
      # والأصولُ الموثوقة فارغةً ← أصلُ العنوان وحده (يحسبه التطبيق).
      - name: اختبارات الوحدة والبناء
        env:
          BASE_URL: ${{ vars.ABAAD_POS_BASE_URL || 'https://pos.example.test' }}
          TRUSTED_ORIGINS: ${{ vars.ABAAD_POS_TRUSTED_ORIGINS }}
        run: >
          gradle -p mobile/android --no-daemon --stacktrace
          testDebugUnitTest assembleDebug
          "-Pabaad.baseUrl=$BASE_URL"
          "-Pabaad.trustedOrigins=$TRUSTED_ORIGINS"

      # Gradle لا يطبع عددَ الاختبارات — فيُقرأ من تقاريرها، ولا يُقال «نجحت» عن صفر
      - name: عدد اختبارات الوحدة
        if: always()
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          totals = {'tests': 0, 'failures': 0, 'errors': 0, 'skipped': 0}
          for path in glob.glob('mobile/android/app/build/test-results/testDebugUnitTest/*.xml'):
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.get(key, 0))
          print('Android unit tests: {tests} run, {failures} failed, {errors} errors, {skipped} skipped'.format(**totals))
          sys.exit(1 if totals['tests'] == 0 else 0)
          PY

      # APK للتجربة على جهازٍ حقيقيّ — يُرفع حين يُبنى بعنوانٍ حقيقيّ وحده:
      # تطبيقٌ على عنوان المثال لا يفتح شيئًا، فلا يُعطى لأحد
      - name: APK للتجربة
        if: vars.ABAAD_POS_BASE_URL != ''
        uses: actions/upload-artifact@v4
        with:
          name: abaad-pos-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error

      - name: تقارير الاختبار
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: mobile/android/app/build/reports/tests/
          if-no-files-found: ignore

  ios:
    name: iOS (حزمة الطباعة + بناء المحاكي)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: اختبارات حزمة الطباعة
        working-directory: mobile/ios/Packages/AbaadPrinting
        run: swift test

      - name: توليد المشروع
        working-directory: mobile/ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: بناء التطبيق للمحاكي
        working-directory: mobile/ios
        run: >
          xcodebuild build
          -project AbaadPOS.xcodeproj
          -scheme AbaadPOS
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
