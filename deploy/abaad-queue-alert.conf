# تنبيهٌ عند سقوط العامل — يُضاف إلى الوحدة القائمة ولا يستبدلها.
#
# ═══ ولمَ drop-in لا ملفَّ وحدةٍ جديد ═══
#
# الوحدةُ الحيّةُ على الخادم تحمل طوابيرَ ومعاملاتٍ قد لا تطابق ما في
# هذا المجلّد. واستبدالُها بملفٍّ «أصحّ» يوقف ما كانت تخدمه — وقع ذلك
# احتمالًا وارِدًا حين كُتب الملفُّ الأوّل بلا أن يُنظر في الخادم.
#
# وdrop-in يضيف سطرًا واحدًا ويترك الباقيَ كما هو.
#
# التثبيت:
#
#     sudo mkdir -p /etc/systemd/system/abaad-queue.service.d
#     sudo cp abaad-queue-alert.conf /etc/systemd/system/abaad-queue.service.d/
#     sudo cp abaad-queue-alert@.service /etc/systemd/system/
#     sudo systemctl daemon-reload
#     systemctl cat abaad-queue     # يُظهر الوحدةَ ومعها هذا السطر
#
# وللتجربة بلا انتظار سقوط:
#
#     sudo systemctl start 'abaad-queue-alert@abaad-queue.service'

[Unit]
OnFailure=abaad-queue-alert@%n.service
